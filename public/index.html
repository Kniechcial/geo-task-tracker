<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoTasker — zadania na mapie</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Style aplikacji -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Panel boczny -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebar__header">
        <h1 class="sidebar__title">GeoTasker</h1>
        <p class="sidebar__subtitle">Twoje zadania przypięte do mapy</p>
      </header>

      <div class="sidebar__body">
        <!-- Pasek trasy (widoczny w trybie trasy) -->
        <div id="route-bar" class="route-bar" hidden>
          <div class="route-bar__info">
            <strong id="route-distance" class="route-bar__distance">0 m</strong>
            <span id="route-count" class="route-bar__count">0 przystanków</span>
          </div>
          <button id="route-clear" class="btn btn--ghost btn--sm" type="button">
            Wyczyść
          </button>
        </div>

        <p id="route-hint" class="route-hint" hidden>
          Klikaj zadania w kolejności, aby ułożyć trasę.
        </p>

        <!-- Lista zadań (wypełniana dynamicznie) -->
        <div id="task-list" class="task-list">
          <p class="empty-state">Kliknij na mapie, aby dodać pierwsze zadanie.</p>
        </div>
      </div>

      <footer class="sidebar__footer">
        <button id="route-toggle" class="btn btn--ghost" type="button">
          Tryb trasy
        </button>
        <button id="locate-btn" class="btn btn--ghost" type="button">
          Moja lokalizacja
        </button>
      </footer>
    </aside>

    <!-- Mapa -->
    <main class="map-wrap">
      <div id="map" class="map"></div>
    </main>
  </div>

  <!-- Modal: dodawanie / edycja zadania -->
  <div id="task-modal" class="modal" hidden>
    <div class="modal__backdrop" data-close="1"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal__title">Nowe zadanie</h2>
      <form id="task-form" class="form">
        <input type="hidden" name="id" />
        <input type="hidden" name="lat" />
        <input type="hidden" name="lng" />

        <label class="form__field">
          <span class="form__label">Tytuł</span>
          <input
            type="text"
            name="title"
            class="form__control"
            placeholder="np. Odebrać paczkę"
            maxlength="80"
            required
          />
        </label>

        <label class="form__field">
          <span class="form__label">Opis (opcjonalnie)</span>
          <textarea
            name="description"
            class="form__control"
            rows="2"
            placeholder="Szczegóły zadania…"
            maxlength="300"
          ></textarea>
        </label>

        <div class="form__row">
          <label class="form__field">
            <span class="form__label">Kategoria</span>
            <select name="category" class="form__control">
              <option value="Praca">Praca</option>
              <option value="Zakupy">Zakupy</option>
              <option value="Dom">Dom</option>
              <option value="Inne" selected>Inne</option>
            </select>
          </label>

          <label class="form__field">
            <span class="form__label">Priorytet</span>
            <select name="priority" class="form__control">
              <option value="wysoki">Wysoki</option>
              <option value="sredni" selected>Średni</option>
              <option value="niski">Niski</option>
            </select>
          </label>
        </div>

        <div class="form__actions">
          <button type="button" class="btn btn--ghost" data-close="1">Anuluj</button>
          <button type="submit" class="btn btn--primary">Zapisz</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Biblioteki (CDN) -->
  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"
  ></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <!-- Kod aplikacji -->
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
